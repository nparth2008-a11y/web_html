<html>
<head>

    <title>CSS Opacity Example</title>

    <style>
        .box1 {
            background-color: purple;
            opacity: 1;
        }

        .box2 {
            background-color: purple;
            opacity: 0.9;
        }

        .box3 {
            background-color: purple;
            opacity: 0.8;
        }
		.box4 {
            background-color: purple;
            opacity: 0.7;
        }

        .box5 {
            background-color: purple;
            opacity: 0.6;
        }

        .box6 {
            background-color: purple;
            opacity: 0.5;
        }
		.box7 {
            background-color: purple;
            opacity: 0.4;
        }

        .box8 {
            background-color: purple;
            opacity: 0.3;
        }
		.box9 {
            background-color: purple;
            opacity: 0.2;
        }

        .box10 {
            background-color: purple;
            opacity: 0.1;
        }
    </style>
</head>

<body>

    <div class="box1">
        Opacity 1
    </div>

    <div class="box2">
        Opacity 0.9
    </div>

    <div class="box3">
        Opacity 0.8
    </div>
	
	<div class="box4">
        Opacity 0.7
    </div>

    <div class="box5">
        Opacity 0.6
    </div>

    <div class="box6">
        Opacity 0.5
    </div>
	
	<div class="box7">
        Opacity 0.4
    </div>

    <div class="box8">
        Opacity 0.3
    </div>

    <div class="box9">
        Opacity 0.2
    </div>
	
	<div class="box10">
        Opacity 0.1
    </div>

</body>
</html>
